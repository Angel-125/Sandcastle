name: Tag Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      PRODUCT_NAME: Sandcastle
      WBC_REPOSITORY: Angel-125/WildBlueCore

    steps:
      - name: Checkout Sandcastle tag
        uses: actions/checkout@v4

      - name: Validate tag and derive release names
        id: release
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must use the format [v]<major>.<minor>.<patch>; received: $TAG" >&2
            exit 1
          fi

          VERSION="${TAG#v}"
          ASSET_VERSION="${VERSION//./_}"
          ASSET_NAME="${PRODUCT_NAME}_${ASSET_VERSION}_R1.zip"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Find latest WildBlueCore release
        id: wildbluecore
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          WBC_TAG="$(gh api "repos/${WBC_REPOSITORY}/releases/latest" --jq '.tag_name')"
          if [ -z "$WBC_TAG" ]; then
            echo "WildBlueCore does not have a latest published release." >&2
            exit 1
          fi

          echo "Using WildBlueCore release: $WBC_TAG"
          echo "tag=$WBC_TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout latest WildBlueCore release
        uses: actions/checkout@v4
        with:
          repository: ${{ env.WBC_REPOSITORY }}
          ref: ${{ steps.wildbluecore.outputs.tag }}
          path: _wildbluecore

      - name: Replace bundled WildBlueCore
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="_wildbluecore/ReleaseFolder/GameData/WildBlueIndustries/00WildBlueCore"
          DESTINATION_BASE="ReleaseFolder/GameData/WildBlueIndustries"
          DESTINATION="${DESTINATION_BASE}/00WildBlueCore"

          if [ ! -d "$SOURCE" ]; then
            echo "Missing WildBlueCore release folder: $SOURCE" >&2
            exit 1
          fi

          mkdir -p "$DESTINATION_BASE"
          rm -rf "$DESTINATION"
          cp -R "$SOURCE" "$DESTINATION"

      - name: Extract Sandcastle release notes
        shell: bash
        run: |
          set -euo pipefail

          README="ReleaseFolder/GameData/WildBlueIndustries/Sandcastle/Readme.txt"
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"

          if [ ! -f "$README" ]; then
            echo "Missing Sandcastle readme: $README" >&2
            exit 1
          fi

          awk '
            { sub(/\r$/, "") }
            $0 == "---CHANGES---" { in_changes=1; found_start=1; next }
            $0 == "---END CHANGES---" { in_changes=0; found_end=1; next }
            in_changes { print }
            END {
              if (!found_start || !found_end) {
                exit 2
              }
            }
          ' "$README" > "$NOTES_FILE" || {
            echo "Could not find both release-note markers in $README" >&2
            exit 1
          }

          if [ ! -s "$NOTES_FILE" ]; then
            echo "The release-notes section in $README is empty." >&2
            exit 1
          fi

          echo "notes_file=$NOTES_FILE" >> "$GITHUB_ENV"

      - name: Create Sandcastle release bundle
        shell: bash
        env:
          ASSET_NAME: ${{ steps.release.outputs.asset_name }}
        run: |
          set -euo pipefail

          if [ ! -d "ReleaseFolder/GameData" ]; then
            echo "Missing release bundle folder: ReleaseFolder/GameData" >&2
            exit 1
          fi

          (
            cd ReleaseFolder
            zip -r "../${ASSET_NAME}" GameData
          )

      - name: Create GitHub release and upload bundle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.version }}
          body_path: ${{ env.notes_file }}
          files: ${{ steps.release.outputs.asset_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
