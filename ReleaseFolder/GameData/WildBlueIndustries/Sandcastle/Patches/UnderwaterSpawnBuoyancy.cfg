// Register a dormant marker on cargo-capable parts so an individual underwater-spawned
// instance can persist its zero-buoyancy state without changing the part prefab globally.
@PART[*]:HAS[@MODULE[ModuleCargoPart],!MODULE[WBIUnderwaterSpawnBuoyancy]]:FOR[Sandcastle]
{
	MODULE
	{
		name = WBIUnderwaterSpawnBuoyancy
		disableBuoyancy = false
	}
}
