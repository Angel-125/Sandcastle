// Adds printed resource requirements when boxed/inflatable/deployed parts are pre-assembled in the craft file.
// This only applies to vessel printing; said parts printed in the print shops will always be in the compacted form.
// Only specific part modules that alter the part mass are supported, including WBIPackingBox, WBIMultipurposeHab, and WBIMultipurposeLab.
// This patch file was specifically created for Pathfinder.
@PART[wbiDrillingRig,wbiStorageDepot,wbiArcReactor,wbiGroundStation,wbiPipeline2,wbiCastilloObservatory,wbiCastilloFactory,wbiRanchHouse2]:NEEDS[WildBlueIndustries/Pathfinder,ClassicStock]
{
	// If the resource already exists in the part's materials list, then it will use this new rate.
	PRINT_RESOURCE_ASSEMBLED
	{
		name = Ore
		rate = 0.25
	}

	PRINT_RESOURCE_ASSEMBLED
	{
		name = Konkrete
		rate = 0.75
	}
}

@PART[wbiRanchHouse2,wbiCastilloFactory]
{
	// This is used when recycling parts/vessels out in the wild or when placing in inventory.
	// There must be a part module that lets Sandcastle know that the part has been unpacked.
	// WBIPackingBox, WBIMultipurposeHab, and WBIMultipurposeLab are all supported natively.
	UNPACKED_INFO
	{
		// In liters, the volume of the part when unpacked/deployed/assembled.
		unpackedVolume = 430000
	}
}

@PART[wbiCastilloObservatory]
{
	UNPACKED_INFO
	{
		// In liters, the volume of the part when unpacked/deployed/assembled.
		unpackedVolume = 552000
	}
}

@PART[wbiStorageDepot]
{
	UNPACKED_INFO
	{
		// In liters, the volume of the part when unpacked/deployed/assembled.
		unpackedVolume = 210000
	}
}

@PART[wbiDrillingRig,wbiArcReactor,wbiGroundStation,wbiPipeline2]
{
	UNPACKED_INFO
	{
		// In liters, the volume of the part when unpacked/deployed/assembled.
		unpackedVolume = 98000
	}
}

@PART[WBI_Ponderosa,WBI_DocSciLab,WBI_Ponderosa2,WBI_Chuckwagon,WBI_Hacienda,WBI_SmokePipe,]:NEEDS[WildBlueIndustries/Pathfinder,ClassicStock]
{
	// If the resource already exists in the part's materials list, then it will use this new rate.
	PRINT_RESOURCE_ASSEMBLED
	{
		name = Ore
		rate = 0.15
	}

	PRINT_RESOURCE_ASSEMBLED
	{
		name = Equipment
		rate = 0.85
	}
}

@PART[wbiRangeland2]:NEEDS[WildBlueIndustries/Pathfinder]
{
	MODULE
	{
		// This is a helper class that the Shipwright uses when spawning a vessel on the ground.
		// It draws a movable wireframe box that shows the dimensions of the vessel, with the
		// move gizmo centered on the Shipwright's spawn transform (defined by spanTransformName), and offset by the vessel's root part.
		// This helper lets players move where they'd like the vessel to spawn- and more importantly, avoid collisions with other vessels.
		name = WBIModuleBoundingBox
	}

	MODULE
	{
		name = WBIShipwright
		printSpeedUSec = 0.1
		UseSpecialistBonus = false

		// Spawn transform
		// Position marks the virtual spawning boundary. The printed craft cannot cross that boundary
		// Local +Z points away from the print head into the space where the craft will spawn.
		// Local +Y points toward the printer’s visual top.
		// Local +X completes the right-handed coordinate frame, corresponds to Unity's global +X.
		spawnTransformName = LaunchPos

		// Maximum possible craft size that can be printed: Height (X) Width (Y) Length (Z). E.G. 5,5,5
		// Leave empty for unlimited printing.
//		maxCraftDimensions = 

		RESOURCE
		{
			name = ElectricCharge
			rate = 10
		}
	}

	MODULE
	{
		name = WBIShipbreaker
		recycleSpeedUSec = 0.1
		recyclePercentage = 0.25
		UseSpecialistBonus = false

		// Maximum distance allowed for other vessels with shipbreakers to help break up a vessel.
		// Default is 50 (meters).
		maxBuildingDistance = 50

		// The recycler itself may require one or more resources in order to operate.
		// You can also use INPUT_RESOURCE in place of RESOURCE, but the other fields remain the same.		
		// It's possible to have some kind of OUTPUT_RESOURCE as well, but we just use the stock resources.
		RESOURCE
		{
			name = ElectricCharge
			rate = 5
		}
	}
}