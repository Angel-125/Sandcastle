PART
{
	name = wbiOmniTool
	module = Part
	author = Angel-125
	MODEL
	{
		model = WildBlueIndustries/Sandcastle/Parts/Cargo/omniTool/omniTool
	}	
	rescaleFactor = 1
	CoMOffset = 0, 0.085, 0
	CoLOffset = 0, 0.085, 0
	CoPOffset = 0, 0.085, 0
	TechRequired = nanolathing	
	entryCost = 1500
	cost = 750
	category = Cargo
	subcategory = 0
	title = #LOC_SANDCASTLE_omniToolTitle // Omni-tool
	manufacturer = #autoLOC_501663 // Dinkelstein Kerman's Construction Emporium
	description = #LOC_SANDCASTLE_omniToolDesc // The Omni-tool is a gauntlet-like device that combines a computer microframe, sensor analysis package, and minifacturing fabricator. It can be used to analyze and adjust the functionality of most standard equipment. With sufficient raw materials and energy pulled from nearby storage containers, the Omni-tool can 3D print small objects.
	attachRules = 0,0,0,0,0
	mass = 0.001
	dragModelType = default
	maximum_drag = 0.1
	minimum_drag = 0.1
	angularDrag = 2
	crashTolerance = 12
	maxTemp = 1200 // = 1200
	tags = 3D print shop contain storage cargo parts cck-Sandcastle

	MODULE
	{
		name = ModuleCargoPart	
		stackableQuantity = 1
		packedVolume = 1
	}	

	MODULE
	{
	    name = WBIModuleWearableItem
	    moduleID = Omni Tool Printer
	    evaModules = WBIModuleEVAPrintShop
	}

	MODULE
	{
		name = WBIModuleWearableItem

		// ID of the module. This should be unique within the part.
		moduleID = Left Gauntlet

		// Where to place the item, such as on the back of the kerbal, the end of the backpack. etc.
		// back: The back of the kerbal.
		// backOrJetpack: The back of the kerbal, or the back of the jetpack if the kerbal is carrying a jetpack.
		// leftFoot: The left foot of the kerbal.
		// rightFoot: The right foot of the kerbal.
		bodyLocation = leftForearm

		// Name of the high-level anchor transform. This will follow the bodyLocation bone as it moves.
		anchorTransform = leftGauntletAnchor

		// Name of the 3D model. This will be rotated and positioned relative to the anchorTransform.
		meshTransform = leftGauntlet
		hideMeshTransformWhenDropped = true


		// Position offset of the meshTransform
		positionOffset = 0.0000, -0.0135, 0.0060

		// Rotation offset of the meshTransform
		rotationOffset = -72.0000, 20.0000, 64.0000
	}

	MODULE
	{
		name = WBIModuleWearableItem

		moduleID = Left Ring Guard
		bodyLocation = leftHand
		anchorTransform = leftRingGuardAnchor
		meshTransform = leftRingGuard
		hideMeshTransformWhenDropped = true
		positionOffset = -0.0400, 0.0350, 0.0000
		rotationOffset = -83.0000, 0.0000, 100.0000
	}

	MODULE
	{
		name = WBIModuleWearableItem

		moduleID = Left Upper Rings
		bodyLocation = leftHand
		anchorTransform = leftUpperRingsAnchor
		meshTransform = leftUpperRings
		hideMeshTransformWhenDropped = true
		positionOffset = -0.0400, 0.0350, 0.0000
		rotationOffset = -83.0000, 0.0000, 97.0000
	}

	MODULE
	{
		name = WBIModuleWearableItem

		moduleID = Left Lower Ring
		bodyLocation = leftHand
		anchorTransform = leftLowerRingAnchor
		meshTransform = leftLowerRing
		hideMeshTransformWhenDropped = true
		positionOffset = -0.0500, -0.0460, 0.0000
		rotationOffset = 96.0000, 0.0000, 90.0000
	}

	MODULE
	{
	    name = WBIModuleWearableItem
	    moduleID = Display Model
	    hideTransformsWhenWorn = displayModel
	}

	EVA_OVERRIDES
	{
		// This will add the OmniToolRepairSkill to kerbals who carry the Omni-tool.
		// Stock skills are supported too. 
		// OmniToolRepairSkill: Permits repacking chutes, repairing wheels, and repairing deployable items
		// like antennas and solar panels (if you have the Repair Kits on hand).
		EXPERIENCE_EFFECT
		{
			name = OmniToolRepairSkill
		}
	}
}
