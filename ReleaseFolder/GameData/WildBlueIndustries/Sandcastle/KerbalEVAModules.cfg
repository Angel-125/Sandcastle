// Registers Sandcastle's personal print shop for dynamic creation. The module exists on a live
// EVA kerbal only while a carried KerbalGear item requests it.
KERBAL_EVA_MODULES
{
	MODULE
	{
		name = WBIModuleEVAPrintShop
		moduleID = EVA Print Shop

		// Only one personal printer and queue may be active on a kerbal. Exclusive is
		// the default, but it is stated here so this module's ownership is unambiguous.
		kerbalGearMode = Exclusive

		// Keep the personal printer limited to small cargo parts.
		maxPrintVolume = 35
		printSpeedUSec = 0.1

		// Maximum distance, in meters, from which the EVA printer can pull resources from other loaded vessels.
		// Set to 0 or a negative value to disable remote resource access. Default is 20 meters.
		maxRemoteResourceRange = 20

		// The EVA Kerbal is the printer's operator.
		UseSpecialistBonus = true
		SpecialistBonus = 0.05
		ExperienceEffect = ConverterSkill

		printShopGUIName = #LOC_SANDCASTLE_openEVAPrintShop
		printShopDialogTitle = #LOC_SANDCASTLE_evaPrintShopTitle
	}

	// Only one part-destruction cursor and highlight controller may be active on a kerbal.
	MODULE
	{
		name = WBIModuleEVAPartDestroyer
		kerbalGearMode = Exclusive
		destructionRange = 7
	}
}
